models:
  - name: fct_orders
    columns:
      - name: order_key
        data_tests:
          - unique
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_key
      - name: status_code
        data_tests:
          - not_null
      - name: priority_code
        data_tests:
          - not_null
      - name: ship_priority
        data_tests:
          - not_null
      - name: clerk_name
        data_tests:
          - not_null
      - name: name
        data_tests:
          - not_null
      - name: market_segment
        data_tests:
          - not_null
      - name: gross_item_sales_amount
        data_tests:
          - not_null
      - name: item_discount_amount
        data_tests:
          - not_null
      - name: item_tax_amount
        data_tests:
          - not_null
      - name: net_item_sales_amount
        data_tests:
          - not_null
